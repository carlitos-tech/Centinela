name: governance

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  validate-governance:
    name: Validar gobierno del repositorio
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Verificar archivos de gobierno requeridos
        shell: bash
        run: |
          set -e
          required_files=(
            "README.md"
            "CLAUDE.md"
            "CONTRIBUTING.md"
            "SECURITY.md"
            ".gitignore"
            ".editorconfig"
            ".github/CODEOWNERS"
            ".github/pull_request_template.md"
            ".github/ISSUE_TEMPLATE/feature.yml"
            ".github/ISSUE_TEMPLATE/bug.yml"
            ".github/ISSUE_TEMPLATE/config.yml"
            "src/CLAUDE.md"
            "web/CLAUDE.md"
            "infra/CLAUDE.md"
            "database/CLAUDE.md"
            "docs/product/product-brief.md"
            "docs/product/mvp-scope.md"
            "docs/product/traceability-matrix.md"
            "docs/architecture/architecture-overview.md"
            "docs/architecture/decision-log.md"
            "docs/architecture/adr/ADR-001-multiagent-architecture.md"
            "docs/architecture/adr/ADR-002-azure-cli-bicep.md"
            "docs/architecture/adr/ADR-003-model-gateway.md"
            "docs/governance/branching-strategy.md"
            "docs/governance/commit-conventions.md"
            "docs/governance/definition-of-done.md"
            "docs/governance/security-rules.md"
            "docs/demo/demo-scorecard.md"
            "docs/demo/demo-script-initial.md"
            "docs/demo/contingency-plan.md"
          )
          missing=0
          for f in "${required_files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "FALTA: $f"
              missing=1
            elif [ ! -s "$f" ]; then
              echo "VACIO: $f"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "Validacion de archivos de gobierno: FALLO"
            exit 1
          fi
          echo "Validacion de archivos de gobierno: OK"

      - name: Verificar que .claude/settings.local.json no esta versionado
        shell: bash
        run: |
          set -e
          if [ -n "$(git ls-files -- '.claude/settings.local.json')" ]; then
            echo "ERROR: .claude/settings.local.json esta versionado."
            exit 1
          fi
          echo "OK: .claude/settings.local.json no esta versionado."

      - name: Verificar ausencia de archivos .env con valores
        shell: bash
        run: |
          set -e
          tracked_env=$(git ls-files -z -- '*.env' '*.env.*' ':(exclude)*.env.example' | tr '\0' '\n')
          if [ -n "$tracked_env" ]; then
            echo "ERROR: archivos .env versionados con posibles valores reales:"
            printf '%s\n' "$tracked_env"
            exit 1
          fi
          echo "OK: sin archivos .env con valores versionados."

      # A partir de la Fase 02 (walking skeleton local), src/ y web/ estan
      # explicitamente autorizados a contener proyectos .NET/Angular
      # funcionales (ver CLAUDE.md, seccion 13). A partir de la Fase 03,
      # infra/ esta explicitamente autorizado a contener plantillas Bicep
      # (IaC declarativa, validada localmente con bicep build/lint y
      # az deployment sub validate/what-if, sin desplegar ningun recurso:
      # ver ADR-002 y docs/evidence/phase-03-azure-cli-gateway-iac-report.md).
      # Cualquier archivo .bicep FUERA de infra/ sigue bloqueado, igual que
      # database/ (SQL funcional), que permanece sin autorizar hasta su
      # propia fase dedicada.
      - name: Verificar ausencia de proyectos funcionales prematuros (infra fuera de alcance/database)
        shell: bash
        run: |
          set -e
          found=0

          bicep_outside_infra=$(git ls-files -z -- '*.bicep' ':(exclude)infra/**' | tr '\0' '\n')
          if [ -n "$bicep_outside_infra" ]; then
            echo "ERROR: se encontraron archivos Bicep fuera de infra/ (no autorizados):"
            printf '%s\n' "$bicep_outside_infra"
            found=1
          fi

          bicepparam_outside_infra=$(git ls-files -z -- '*.bicepparam' ':(exclude)infra/**' | tr '\0' '\n')
          if [ -n "$bicepparam_outside_infra" ]; then
            echo "ERROR: se encontraron archivos de parametros Bicep fuera de infra/ (no autorizados):"
            printf '%s\n' "$bicepparam_outside_infra"
            found=1
          fi

          sql_matches=$(git ls-files -z -- 'database/*.sql' | tr '\0' '\n')
          if [ -n "$sql_matches" ]; then
            echo "ERROR: se encontraron scripts SQL funcionales no autorizados en database/:"
            printf '%s\n' "$sql_matches"
            found=1
          fi

          if [ "$found" -eq 1 ]; then
            echo "Validacion de codigo funcional prematuro: FALLO"
            exit 1
          fi
          echo "Validacion de codigo funcional prematuro: OK"

      # Escaneo de datos sensibles usando "git grep" directamente sobre el contenido
      # versionado. A diferencia de "git ls-files | xargs grep", esto no depende de
      # dividir una lista de rutas por espacios en blanco, por lo que nombres de
      # archivo con espacios (p. ej. "docs/evidence/evidencia funcionamiento proxy.png")
      # se procesan de forma segura y ningun archivo queda sin analizar.
      # Los codigos de salida de "git grep" se interpretan explicitamente:
      #   0 = coincidencia encontrada (dato sensible detectado -> fallo)
      #   1 = sin coincidencias (resultado normal, no es un error)
      #  >1 = fallo real de la herramienta (no se oculta: aborta el job)
      - name: Escaneo de secretos y datos sensibles conocidos
        shell: bash
        run: |
          set -e
          fail=0

          # package-lock.json es un archivo generado automaticamente por npm a
          # partir del registro publico; puede contener direcciones de correo
          # de mantenedores de paquetes de terceros (metadata publica del
          # registro npm, no datos del equipo de desarrollo). Se excluye del
          # escaneo de correos para evitar falsos positivos sobre contenido
          # que ninguna persona de este proyecto escribio ni controla.
          #
          # Los archivos de pruebas del redactor de salida de Azure CLI
          # (AzureCliOutputRedactor) necesariamente contienen, en texto plano,
          # ejemplos de GUID/correo/ruta local *ficticios* como entrada de
          # prueba, para verificar que el redactor los enmascara. Se excluyen
          # puntualmente esos dos archivos (no todo tests/) de los escaneos de
          # ruta/correo/GUID; ningun otro archivo de pruebas queda exento.
          #
          # infra/modules/key-vault.bicep referencia un roleDefinitionId de un
          # rol integrado de Azure (Key Vault Secrets User): un GUID publico y
          # documentado por Microsoft, identico en cualquier tenant, no un
          # Tenant ID ni Subscription ID. Se excluye puntualmente ese archivo
          # del escaneo de GUID.
          scan() {
            label="$1"
            pattern="$2"
            shift 2
            pathspecs=("$@")
            if [ "${#pathspecs[@]}" -eq 0 ]; then
              pathspecs=(".")
            fi
            rc=0
            git grep -zIlE "$pattern" -- "${pathspecs[@]}" > /tmp/gg_hits 2> /tmp/gg_err || rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "ERROR: $label detectado(s) en archivos versionados:"
              tr '\0' '\n' < /tmp/gg_hits
              fail=1
            elif [ "$rc" -eq 1 ]; then
              echo "OK: sin coincidencias de $label."
            else
              echo "ERROR: fallo al ejecutar el escaneo de $label (codigo $rc), no se puede garantizar cobertura completa:"
              cat /tmp/gg_err
              exit 1
            fi
          }

          redactor_test_exclude_1=':(exclude,glob)tests/Centinela.UnitTests/AzureCli/AzureCliOutputRedactorTests.cs'
          redactor_test_exclude_2=':(exclude,glob)tests/Centinela.UnitTests/AzureCli/AzureCliCommandGatewayTests.cs'
          builtin_role_exclude=':(exclude,glob)infra/modules/key-vault.bicep'

          # Secretos y credenciales conocidos (tokens GitHub/AWS/Slack, llaves privadas).
          scan "secretos/credenciales conocidos" '(ghp_[A-Za-z0-9]{30,}|gho_[A-Za-z0-9]{30,}|-----BEGIN [A-Z ]*PRIVATE KEY-----|AKIA[0-9A-Z]{16}|xox[baprs]-[A-Za-z0-9-]{10,})'

          # Rutas locales completas del equipo de desarrollo.
          scan "rutas locales completas" 'C:\\Users\\[A-Za-z0-9._-]+|/home/[A-Za-z0-9._-]+/' . "$redactor_test_exclude_1" "$redactor_test_exclude_2"

          # Correos electronicos (validacion generica, sin listar proveedores especificos).
          # Excluye lockfiles generados (metadata publica de terceros del registro npm).
          scan "correos electronicos" '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' . ':(exclude,glob)**/package-lock.json' "$redactor_test_exclude_1" "$redactor_test_exclude_2"

          # Identificadores tipo GUID sin enmascarar (posible Tenant ID / Subscription ID de Azure).
          scan "identificadores tipo GUID (Tenant/Subscription ID) sin enmascarar" '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}' . "$redactor_test_exclude_1" "$redactor_test_exclude_2" "$builtin_role_exclude"

          if [ "$fail" -eq 1 ]; then
            echo "Escaneo de seguridad: FALLO"
            exit 1
          fi
          echo "Escaneo de seguridad: OK"
